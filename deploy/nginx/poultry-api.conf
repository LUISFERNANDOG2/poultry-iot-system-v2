# Versioned production virtual host for poultry.example.org.
# TLS certificates and Certbot-managed TLS options remain on the host.

server {
    server_name poultry.example.org;

    client_max_body_size 64k;

    # Keep all add_header directives in this server-level include. Adding an
    # add_header inside a location would disable normal parent inheritance.
    include /etc/nginx/snippets/poultry-security-headers.conf;

    # Browser calls (live data, history, alerts, devices, security events) go to
    # the dashboard, which checks the session and forwards them to the API with
    # its internal proxy key. The API itself only accepts JWT or that key.
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cabeceras internas dashboard -> API: nunca se aceptan desde fuera.
        proxy_set_header X-Dashboard-Proxy-Key "";
        proxy_set_header X-Dashboard-User-Id "";
        proxy_set_header X-Dashboard-Source-IP "";
    }

    # Direct API for JWT clients (scripts, the pentest harness):
    # /backend/api/login, /backend/api/live-data, ...
    location /backend/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cabeceras internas dashboard -> API: nunca se aceptan desde fuera.
        proxy_set_header X-Dashboard-Proxy-Key "";
        proxy_set_header X-Dashboard-User-Id "";
        proxy_set_header X-Dashboard-Source-IP "";
    }

    # Telemetry from remote gateways; protected by the ingest key and validation.
    location /lecturas {
        proxy_pass http://127.0.0.1:5000/lecturas;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cabeceras internas dashboard -> API: nunca se aceptan desde fuera.
        proxy_set_header X-Dashboard-Proxy-Key "";
        proxy_set_header X-Dashboard-User-Id "";
        proxy_set_header X-Dashboard-Source-IP "";
    }

    location / {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cabeceras internas dashboard -> API: nunca se aceptan desde fuera.
        proxy_set_header X-Dashboard-Proxy-Key "";
        proxy_set_header X-Dashboard-User-Id "";
        proxy_set_header X-Dashboard-Source-IP "";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/poultry.example.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/poultry.example.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # HSTS must never be emitted by this clear-text redirect server.
    server_tokens off;

    if ($host = poultry.example.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name poultry.example.org;
    return 404; # managed by Certbot
}
